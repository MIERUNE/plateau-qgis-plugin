[project]
name = "qgis-plateau-plugin"
version = "0.0.0"
description = ""
authors = [{ name = "Project PLATEAU", email = "no-reply@mlit.go.jp" }]
readme = "README.md"
requires-python = ">=3.9,<4.0"
packages = [{ include = "plateau_plugin" }]

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=6"]
lint = ["bandit>=1.7", "ruff>=0.3"]
dev = [{ include-group = "test" }, { include-group = "lint" }, "pyqt5-stubs>=5"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = ["--import-mode=importlib"]
# filterwarnings = "ignore::DeprecationWarning"

[tool.ruff]
target-version = "py38"
lint.select = [
    "F",
    "E",
    "W",
    "B",
    "N",
    "UP",
    "I",
    "C90",
    "C4",
    "DTZ",
    "PIE",
    "PT",
    "Q",
    "SIM",
    "RUF",
]
lint.ignore = ["N802", "E501"]

[tool.ruff.lint.isort]
known-third-party = ["plateau"]

[tool.coverage.run]
source = ['plateau_plugin']
concurrency = ["thread"]
