[project]
name = "qgis-plateau-plugin"
version = "0.0.0"
description = ""
authors = [{ name = "Project PLATEAU", email = "no-reply@mlit.go.jp" }]
readme = "README.md"
requires-python = ">=3.9,<4.0"
packages = [{ include = "plateau_plugin" }]

[dependency-groups]
dev = ["bandit[toml]>=1.7", "pytest>=8", "pytest-cov>=6", "pyqt5-stubs>=5", "ruff>=0.3"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = ["--import-mode=importlib"]
# filterwarnings = "ignore::DeprecationWarning"

[tool.ruff]
target-version = "py38"
lint.select = [
    "F",
    "E",
    "W",
    "B",
    "N",
    "UP",
    "I",
    "C90",
    "C4",
    "DTZ",
    "PIE",
    "PT",
    "Q",
    "SIM",
    "RUF",
]
lint.ignore = ["N802", "E501"]

[tool.ruff.lint.isort]
known-third-party = ["plateau"]

[tool.bandit]
# assert は型の絞り込みや内部の不変条件の確認にのみ使っている (plateau/ は make update_dependencies で上書きされる)
skips = ["B101"]

[tool.coverage.run]
source = ['plateau_plugin']
concurrency = ["thread"]
