name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis_image_tag: [release-3_28, "4.2"]
    env:
      OS: ubuntu
      QGIS_IMAGE_TAG: ${{ matrix.qgis_image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull QGIS image
        run: docker pull qgis/qgis:${{ matrix.qgis_image_tag }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Export requirements.txt
        run: |
          uv export --only-group test > requirements.txt

      - name: Run tests
        # PIP_BREAK_SYSTEM_PACKAGES: QGIS 4.x の Debian ベースのイメージは PEP 668 で pip install が拒否される (古い pip は無視する)
        run: >
          docker run --rm --env PIP_BREAK_SYSTEM_PACKAGES=1 --volume `pwd`:/app -w=/app qgis/qgis:${{ matrix.qgis_image_tag }} sh -c "
            pip3 install --require-hashes --no-deps -r requirements.txt &&
            PYTHONPATH=/app:\$PYTHONPATH xvfb-run -s '+extension GLX -screen 0 1024x768x24' pytest -v --cov --cov-report=xml --cov-report=term
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          env_vars: OS,QGIS_IMAGE_TAG
          fail_ci_if_error: false
